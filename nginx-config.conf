server {
    listen 80;
    listen [::]:80;
    
    server_name driverlicens.online www.driverlicens.online;
    
    root /var/www/driverlicens.online;
    index index.html;
    
    # Логи
    access_log /var/log/nginx/driverlicens.access.log;
    error_log /var/log/nginx/driverlicens.error.log;
    
    # Основные страницы
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Кеширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Кеширование HTML
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml 
        application/xml+rss 
        image/svg+xml;
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Отключаем лишние заголовки
    server_tokens off;
}
